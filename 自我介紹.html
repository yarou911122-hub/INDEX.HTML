<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人介紹網頁</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif;
           background: #f4f7fb; margin: 0; padding: 40px 20px; }
    main { max-width: 800px; margin: auto; }
    h1 { text-align: center; color: #173a63; font-size: 36px; }
    .intro { text-align: center; font-size: 18px; }
    .cards { display: flex; gap: 20px; margin-top: 30px; }
    .card { flex: 1; background: white; padding: 24px;
            border-radius: 12px; }
    @media (max-width: 600px) {
      .cards { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>關於我</h1>
    <p class="intro">大家好，我是王小明！</p>
    <div class="cards">
      <section class="card">
        <h2>我的興趣</h2>
        <p>我喜歡攝影和旅行。</p>
      </section>
      <section class="card">
        <h2>我的專長</h2>
        <p>我正在學習網頁設計。</p>
      </section>
    </div>
  </main>
</body>
</html>
